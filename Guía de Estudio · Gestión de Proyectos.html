<script>
const T=[
{n:1,t:"Introducción al diseño y gestión de proyectos",
sum:[
"<b>Proyecto</b>: secuencia bien definida de eventos con principio y fin, objetivo claro, realizada por personas dentro de parámetros de tiempo, coste, recursos y calidad. Es una «empresa» temporal para crear un producto o servicio <b>único</b>.",
"<b>Características</b>: <b>temporal</b> (termina al lograr objetivos, al ser inalcanzables o al dejar de ser necesario; el resultado no tiene por qué ser temporal, ej. pirámides), <b>único</b> (aunque haya elementos repetitivos) y <b>gradual</b> (alcance se refina; admite ciclos espiral o iterativo).",
"<b>Proyecto tecnológico</b>: secuencia de etapas para crear/modificar un producto u organizar un proceso o servicio, como respuesta tecnológica a una necesidad. Su activo más valioso es el <b>elemento humano</b>, por lo que el director también necesita habilidades de RR. HH.",
"<b>Dirigir un proyecto</b>: planificar, organizar, asignar recursos, monitorizar, controlar y liderar. Equilibra alcance, tiempo y coste (<b>triángulo</b> con la calidad en el centro); cada lado no cambia sin alterar los otros dos. Se evalúa con <b>idoneidad, eficiencia y eficacia</b>. Todo proyecto TIENE que tener director.",
"<b>Fases</b> (desde la dirección): <b>preparación</b> (diseño y planificación, reunión de lanzamiento), <b>gestión</b> (seguimiento y control: comparar dónde estamos vs dónde debemos estar y corregir) y <b>terminación</b> (cerrar la cuenta, transmitir conocimiento, salida ordenada del equipo).",
"<b>Necesidad de planificar</b>: pasar del «arte» a la «ingeniería» para minimizar (no evitar) errores. El problema nace a mediados de los 60 (ordenadores de 3.ª generación). Principio <b>KISS</b> (Kelly Johnson, Lockheed); leyes de Murphy; Tony Hoare (Turing 1980).",
"<b>Historia</b>: Gizeh 2570 a. C.; Gantt 1910; CPM 1957; PERT 1958 (misiles Polaris); PMI 1969; Earned Value 1970; Brooks «mes-hombre» 1975; COCOMO (años 80); Scrum 1986; Calidad Total en los 90.",
"<b>El reto</b>: territorio desconocido, expectativas, comunicación y equilibrio entre exigencias (<b>triple restricción</b>). Genera conflicto con los directores funcionales (doble dependencia) y exige <b>cambio cultural</b>.",
"<b>Tres niveles</b>: planificación estratégica (horizonte lejano, metas globales, alta dirección), <b>dirección de proyectos</b> (plazo medio, metas parciales, órganos directivos) y control de calidad (futuro inmediato, tareas concretas, personal técnico)."],
tabla:"<div class='tw'><table><tr><th></th><th>Proyectos</th><th>Operaciones</th></tr><tr><td>Objeto</td><td>Alcanzar objetivos y completarlos</td><td>Mantener la organización</td></tr><tr><td>Tiempo</td><td>Temporales, con inicio y fin</td><td>Continuas</td></tr><tr><td>Resultados</td><td>Producto/servicio único</td><td>No único</td></tr><tr><td>Gente</td><td>Equipos temporales y dinámicos</td><td>Equipos funcionales</td></tr></table></div>",
key:["Triángulo: alcance, tiempo, coste (+calidad); indicadores: idoneidad, eficiencia, eficacia.","El director de proyectos está en el nivel intermedio (gestión de proyectos).","Fases: preparación → gestión → terminación.","Del arte a la ingeniería: minimizar, no evitar, los errores."],
q:"¿Por qué no se puede reducir el coste sin tocar otro lado del triángulo?",a:"Porque cada lado es una restricción que no puede cambiarse sin alterar los otros dos: reducir coste implica reducir alcance, o no se puede aumentar el alcance sin aumentar coste o plazo."},
{n:2,t:"Metodologías y estándares de diseño y gestión",
sum:[
"<b>Metodología</b>: conjunto de procedimientos basados en principios lógicos; define <b>qué</b> hacer. <b>Estándar</b>: modelo o especificación que define <b>cómo</b> hacerlo y suele ser parte de una metodología. No existe una metodología única: se adapta con enfoque <i>pick-and-choose</i>.",
"Hay que distinguir la gestión del proyecto del desarrollo del producto. Ejemplos de metodologías completas: MÉTRICA (España), MERISE (Francia), PRINCE2 (Reino Unido). Fases mínimas comunes: conceptualización/preparación, desarrollo/seguimiento y control, cierre.",
"<b>Pesadas/tradicionales</b> (cascada, predictivas, burocráticas): útiles en proyectos muy complejos o con equipos de más de 10–20 personas en varias ubicaciones. <b>Ligeras/ágiles</b>: funcionan bien con el cambio, orientadas a personas, poca documentación, «metodologías de aprendizaje» por iteración; se basan en el Manifiesto Ágil.",
"<b>PMI</b> fundado en 1969; certificación PMP desde 1987. <b>PMBOK</b>: 1.ª ed. 1996; 2.ª ed. 2000 = estándar ANSI (único en gestión de proyectos) e IEEE Std 1490-2003. Es una guía de <b>buenas prácticas</b>, no una norma: el equipo decide qué es apropiado. Clave: identificar, generalmente reconocido, buenas prácticas.",
"<b>Ediciones</b>: 5.ª (2013) 47 procesos, 5 grupos, 10 áreas (nueva: Interesados). 6.ª (2017): nuevos procesos (gestionar el conocimiento, implementar respuestas a riesgos, controlar recursos); tiempo→calendario, RR. HH.→recursos. 7.ª (2021): basada en <b>principios</b>, enfoque adaptativo, sistema de entrega de <b>valor</b>, 8 dominios de desempeño y plataforma PMIstandards+.",
"<b>12 principios</b>: administrador diligente; entorno colaborativo; involucrar a interesados; enfocarse en valor; interacciones del sistema; liderazgo; adaptar según contexto; calidad en procesos y entregables; navegar la complejidad; optimizar respuestas a riesgos; adaptabilidad y resiliencia; permitir el cambio.",
"<b>8 dominios de desempeño</b>: interesados, equipo, enfoque de desarrollo y ciclo de vida, planificación, trabajo del proyecto, entrega, métricas, incertidumbre (simultáneos, interdependientes).",
"<b>10 áreas de conocimiento (6.ª ed.)</b>: integración, alcance, programación, costes, calidad, recursos, comunicaciones, riesgos, adquisiciones, interesados. <b>5 grupos de procesos</b>: iniciación, planificación, ejecución, seguimiento y control, cierre (se solapan).",
"<b>Intervinientes</b>: stakeholders; <b>cliente</b> (aporta la financiación) vs <b>usuario</b> (usa los resultados); organización responsable; project manager; equipo de gestión y equipo del proyecto. Influyen la madurez, cultura, estilo de dirección y estructura de la organización. Ciclos de vida: cascada, espiral, entrega evolutiva, prototipado incremental.",
"<b>Scrum</b>: proceso empírico, iterativo e incremental. Origen: artículo de 1986 (Takeuchi y Nonaka); formalizado en 1995 por Schwaber y Sutherland. Roles: <b>Product Owner, Scrum Master, Scrum Team, Cliente</b>. <b>Sprint</b> de 2–4 semanas (recomendado un mes); <b>product backlog</b> y <b>sprint backlog</b>; <b>daily</b> de máx. 15 min; <b>sprint review</b> al final. Ventajas: fácil, mucho feedback; inconvenientes: tareas mal definidas, exige equipos comprometidos."],
key:["Metodología = qué hacer; estándar = cómo hacerlo.","PMBOK: estándar ANSI (2.ª ed.) y IEEE 1490-2003; buenas prácticas, no norma.","PMBOK 7: principios (12) + dominios (8); PMBOK 6: áreas (10) + procesos.","Sprint 2–4 semanas; daily ≤ 15 min."],
q:"¿Qué cambia entre la 6.ª y la 7.ª edición del PMBOK en el enfoque?",a:"La 6.ª se basa en áreas de conocimiento y procesos; la 7.ª pasa a un estándar basado en principios y dominios de desempeño, con visión de entrega de valor y enfoque adaptativo."},
{n:3,t:"Diseño del proyecto",
sum:[
"La <b>preparación</b> tiene dos subfases: <b>diseño</b> (definir el problema/producto) y <b>planificación</b> (plan de desarrollo). «Fallar en la planificación es planificar el fallo».",
"El origen del proyecto es difuso y está fuera de su ámbito de control; la necesidad se percibe como <b>problema u oportunidad</b>. La definición del problema ocupa poco tiempo pero es la base de todo y debe ser revisada por todos los implicados. Un comité autoriza según alineación con el plan estratégico, resultado alcanzable en plazo razonable y consideración estratégica (mercado, organización, cliente, avance tecnológico, requisito legal).",
"El análisis puede concluir que no hay necesidad real, que el retorno es insuficiente o que es más viable comprar. Modalidades: <b>subcontratado</b> (existe <b>fase contractual</b>: solicitar, valorar y elegir ofertas) o <b>in house</b> (subcontratación interna).",
"<b>Evitar</b>: «soluciones en busca de un problema» y que los únicos interesados sean los propios implicados del proyecto.",
"<b>Qué definir</b>: <b>objetivos</b> (win conditions; justificación de negocio tangible, ej. ROI, e intangible; análisis de viabilidad), <b>fines</b> (criterios de éxito, máx. ~6, regla <b>SMART</b>), <b>ámbito</b> (límites y entregables; línea base) y <b>requisitos</b> (nunca se dedica demasiado tiempo; incluyen ámbito, funciones, dimensiones, usuarios y restricciones).",
"<b>Gold plating</b>: entregar más funcionalidades de las requeridas (no figura en el PMBOK). <b>Scope creeping</b>: el alcance crece con pequeños cambios por falta de control de cambios, requisitos pobres o jefe débil. Ayuda escribir lo que NO es el proyecto.",
"<b>Planificación</b>: concreta los tres cimientos alcance (especificaciones), coste (presupuesto) y duración (calendario); es top-down y su salida es el <b>Plan de Gestión del Proyecto (PGP)</b>, cuya aprobación cierra el diseño e inicia el desarrollo. Empieza con la apertura del código del proyecto.",
"<b>Organización y planificación (9 tareas)</b>: modelo de seguimiento; equipos y configuración organizativa (matriz de responsabilidades); planificación detallada y presupuesto; metodología, procedimientos y estándares; riesgos y expectativas; plan de transferencia; plan de calidad; formación del equipo; elaboración del PGP (junto con el PAC).",
"<b>Kick-off</b>: reunión de lanzamiento que aprueba objetivos y alcance del PGP y oficializa la fase de desarrollo. Convoca a usuarios clave, responsables de equipos, proveedores, dirección y comités. El gestor prepara la presentación, la logística y el acta post-reunión."],
key:["SMART: Specific, Measurable, Achievable, Realistic, Time-bound.","Gold plating ≠ scope creeping.","Salida de la planificación = PGP; su aprobación marca el inicio del desarrollo.","Fase contractual solo si se subcontrata."],
q:"¿Qué diferencia hay entre gold plating y scope creeping?",a:"Gold plating: el equipo añade por su cuenta más funcionalidades de las requeridas. Scope creeping: el alcance cambia lentamente por peticiones aparentemente pequeñas sin control de cambios."},
{n:4,t:"Planificación del proyecto tecnológico",
sum:[
"<b>Términos</b>: planificación (subfase de la preparación), <b>PGP</b> (documento que recoge sus resultados; «la Biblia del proyecto»), organización y planificación, y <b>programa de trabajo</b> (calendario que enlaza tareas con recursos y permite estimar costes).",
"<b>Entradas del plan</b>: documento de requisitos del usuario, normativa, metodologías/estándares, experiencia previa, lista de recursos, costes unitarios, riesgos, factores ambientales y restricciones externas.",
"<b>Secuencia de 9 pasos</b>: definir productos y actividades; estructurar en tareas (EDT); buscar dependencias; estimar recursos, esfuerzo y duración; definir la red de actividades; establecer la programación; asignar recursos; estimar costes; revisión y análisis crítico (iterativo).",
"<b>Dependencias</b>: Fin-Inicio (FI), Inicio-Inicio (II), Inicio-Fin (IF), Fin-Fin (FF), con retardos positivos o negativos. <b>D = E / R</b> (duración = esfuerzo / recursos). Duración ≠ tiempo de calendario. Riesgos de sobreasignación: Ley de Parkinson y «nueve mujeres no tienen un bebé en un mes» (Brooks).",
"<b>Revisión</b>: conflictos de programación, de recurso y de plazos con terceros. Si no se llega a la fecha: análisis <b>estratégico</b> (cambiar la red) o <b>táctico</b> (más recursos para cambiar tiempos).",
"<b>Salidas</b>: EDT y descripción, entregables, organización (roles), secuencia, cronograma, tiempo total, recursos y coste total. Se definen 8 <b>procedimientos</b> (edición y nomenclatura de documentos, distribución, reuniones, revisión y aprobación, control de cambios, control de avance, informes de progreso), propuestos por el gestor y aprobados por el Comité de Dirección.",
"<b>PGP</b>: lo elabora el gestor (con aportes de todos); define funciones, actividades y tareas, integra objetivos, metodología, plan de trabajo, RR. HH., riesgos y responsabilidades; es línea base para medir el avance. Estructura según IEEE o ESA.",
"<b>EDT/WBS</b>: descomposición jerárquica orientada a entregables, de lo general a lo particular; hasta 6 niveles, ideal 3–4 de profundidad y 5–9 elementos por nivel, máx. 100–200 terminales; codificación jerárquica (1, 1.1…). <b>Hito</b>: actividad de duración cero (rombo/triángulo). Reglas de Yourdon (unidades de ~1 semana).",
"<b>Diagramas de red</b> (años 50, Defensa EE. UU.): <b>DAL</b> (actividad en línea: flechas), <b>DAN</b> (actividad en nodos), <b>DP</b> (precedencia, con esperas o desfases). No están a escala temporal. <b>Gantt</b> (Henry Gantt, ~1900): barras proporcionales al calendario; no muestra explícitamente dependencias.",
"<b>CPM</b> (Walker, DuPont, y Kelley, Remington Rand; 1956–58): camino crítico = el más largo de la red, holgura mínima; un retraso en él retrasa el proyecto. <b>PERT</b>: duraciones probabilísticas (CPM: deterministas). Fct = mayor fin de las precedentes; Fft = Fct + dE; FCT = FFT − dE; <b>holgura total</b> H = FFT − Fft; holgura libre ≤ holgura total. CPM asume recursos ilimitados."],
key:["D = E / R; FI, II, IF, FF.","Camino crítico: el más largo; holgura mínima.","CPM determinista vs PERT probabilístico.","EDT: orientada a entregables y no a plan de ejecución; el PGP lo elabora el gestor."],
q:"Un proyecto necesita 40 días-persona de esfuerzo y asignas 4 recursos. ¿Qué duración resulta?",a:"D = E / R = 40 / 4 = 10 días (siempre que la duración dependa de los recursos asignados)."},
{n:5,t:"Ejecución, control y cierre del proyecto",
sum:[
"<b>Éxito</b>: los stakeholders acuerdan antes los criterios de aceptación y éxito. Variables favorables: relación con la organización (alineado, apoyo de la dirección), equipo (liderazgo, comunicación, proactividad), expectativas, recursos y planificación/gestión de imprevistos.",
"<b>Kanban</b>: «tarjetas visuales» (Toyota, años 40, just in time). Principios Lean: calidad garantizada, reducción del desperdicio, mejora continua y flexibilidad. Tablero básico: por hacer, en curso, hecho. Frente a Scrum (sprints fijos), Kanban es flujo continuo.",
"<b>Comunicaciones</b>: el PMI aconseja ~90 % del tiempo del director. Tres retos: decir lo que se quiere decir, que el receptor quiera recibirlo y el filtro de su marco de creencias. Logos, Ethos, Pathos; las «5 C» (cortés, constante, conciso, claro, convincente); AIDA. Informes con código de colores (rojo, verde, ámbar), regulares y adaptados a la audiencia.",
"<b>Expectativas y reuniones</b>: gestionar sobre líneas de base, no dar nada por sentado. Reuniones: orden del día previo, objetivos no ambiciosos, estar «todos los que tienen que estar», acta con responsables y tareas. Las reuniones inaugurales alinean expectativas y crean sentido de equipo.",
"<b>Subcontratación</b>: proceso de evaluación y selección, contrato, condiciones de relación y comunicación, condiciones de entrega. «No asuma nada», relación win-win, pago vinculado a aceptación de entregables, contratos por fase. Comparativa de contratos <b>T&amp;M</b> (tiempo y materiales) vs <b>Precio Garantizado</b>. Contrato legal: firma de representante legal, consideraciones mutuas, voluntariedad e intencionalidad legal.",
"<b>Calidad</b>: ISO 9000:2015: grado en que un conjunto de características inherentes cumple los requisitos. En proyectos es una <b>decisión y un objetivo</b>, no perfección. Gestión de calidad = planificación, aseguramiento, control y mejora, recogida en el <b>Plan de Calidad</b> definido al inicio.",
"<b>Riesgos</b>: eventos con efecto positivo o negativo; tipos: gestión, recursos, requerimientos, tecnología, entorno, aceptación. <b>Riesgo = probabilidad × impacto</b> (prioridad A muy alta a E muy baja). Respuestas: <b>transferir, reducir, evitar, retener, compartir</b>; plan de contingencia; revisión periódica.",
"<b>Cambios</b>: variación de alcance, calendario, costes, calidad o criterios de aceptación; ~80 % proceden del alcance. Reconocer, evaluar impacto, comunicar y ajustar la planificación. Prevención: requisitos sólidos, cierres de aceptación formales, EDT detallada, pruebas piloto, controlar gold plating y cambios pequeños.",
"<b>Control</b>: principios de prevención, detección y acción (correctivas, control de cambios, lecciones aprendidas). Línea base, paquetes de trabajo pequeños, hitos de control, «regla del 15 %» (800 proyectos del Dpto. de Defensa de EE. UU.), criterio de finalización claro (evitar «está al 90 %»), <b>umbrales de escalada</b> (ej. sobrecoste &gt; 10 % involucra a la dirección).",
"<b>Valor Ganado (EVM)</b>: método objetivo del PMBOK (estándar publicado por el PMI en 2005) que integra alcance, cronograma y coste. Variables: PV (valor planificado), EV (valor ganado), AC (coste real), BAC (presupuesto total).",
"<b>Cierre</b>: puede ser por completarse, cancelación, colapso, etc. (p. ej. «muerte lenta» por deterioro). Premisas: cumplir obligaciones contractuales, entregar y traspasar, aceptación del cliente, trámites administrativos; y además lecciones aprendidas, archivo de documentos y evaluación del equipo."],
tabla:"<div class='tw'><table><tr><th>Indicador</th><th>Fórmula</th><th>Lectura</th></tr><tr><td>CV (variación coste)</td><td>EV − AC</td><td>+ bajo presupuesto</td></tr><tr><td>CPI</td><td>EV / AC</td><td>&gt;1 bien; =1 según plan; &lt;1 mal</td></tr><tr><td>SV (variación cronograma)</td><td>EV − PV</td><td>+ adelantado</td></tr><tr><td>SPI</td><td>EV / PV</td><td>&gt;1 adelanto; =1 según plan; &lt;1 retraso</td></tr><tr><td>EAC</td><td>AC + (BAC − EV) &nbsp;|&nbsp; BAC / CPI &nbsp;|&nbsp; AC + (BAC − EV)/(CPI×SPI) &nbsp;|&nbsp; AC + nueva estimación</td><td>Coste final estimado</td></tr><tr><td>TCPI</td><td>(BAC − EV)/(BAC − AC) &nbsp;o&nbsp; (BAC − EV)/(EAC − AC)</td><td>&gt;1 malo; &lt;1 hay holgura</td></tr></table></div>",
key:["Riesgo = probabilidad × impacto; 5 respuestas: transferir, reducir, evitar, retener, compartir.","~80 % de los cambios vienen del alcance.","CPI = EV/AC; SPI = EV/PV; CV = EV − AC; SV = EV − PV.","Calidad: planificación, aseguramiento, control y mejora."],
q:"En el mes 3 un proyecto tiene EV = 20 000 y AC = 25 000. ¿Qué indica el CPI?",a:"CPI = EV / AC = 20 000 / 25 000 = 0,8 &lt; 1: el proyecto va mal en costes (por encima del presupuesto)."},
{n:6,t:"El liderazgo en proyectos tecnológicos",
sum:[
"<b>Estructuras</b>: <b>funcional</b> (la más tradicional; responsabilidad diluida), <b>equipos de proyecto</b> (origen reciente, control directo y coordinación óptima, pero más costosa) y <b>matriz</b> (Cleland y King, 1968; mezcla ventajas e inconvenientes; el director no tiene autoridad directa sobre los técnicos y debe apoyarse en su liderazgo).",
"<b>Reparto en matriz</b>: el director de proyecto decide qué, cuándo y cuánto cuesta; el director funcional decide cómo (calidad técnica) y quién (personal). Elección: muchos proyectos pequeños y poca tecnología → funcional; proyecto grande y largo → equipos de proyecto; tecnología y tamaño medio → matriz.",
"<b>Director de proyectos tecnológicos</b>: integra la vertiente técnica y la de liderazgo. Funciones: <b>planificación, organización, coordinación, control y motivación</b>. A mayor inversión o complejidad, disminuyen las tareas técnicas y aumentan las de gestión.",
"<b>5 tipologías (Booz, Allen &amp; Hamilton)</b> con autoridad creciente: 1 centralizador de información, 2 activador de proyecto, 3 coordinador, 4 jefe de proyecto (típico en matriz), 5 director de proyecto (mando pleno). Solo dos tienen autoridad real para ser directores.",
"<b>Autoridad</b>: formal (legal) e informal (liderazgo y carisma), siendo la informal más importante. <b>Capacidades</b>: técnicas de gestión, tecnológica, gestión empresarial, comunicación y <b>liderazgo</b> (la más difícil, integra a las demás).",
"<b>Errores comunes</b> (Horine, 15): no entender los objetivos, no gestionar expectativas, calendarios poco realistas, no usar control de cambios, mala comunicación, no gestionar riesgos de forma proactiva, falta de liderazgo, etc. <b>Claves</b>: empatía, ganar confianza y respeto, gestionar el capital humano, visión global, proactividad, asumir responsabilidad y autocontrol.",
"<b>Rendimiento del equipo</b>: metas claras, compromiso, buen clima y profesionalidad. Estrategias: gestionar el tiempo personal (matriz urgente/importante de Covey: centrarse en lo importante no urgente), <b>delegación en encargados</b> (resultados, directrices, recursos, rendición de cuentas, consecuencias) vs recaderos, reclutar los perfiles adecuados (>80 % del éxito), <b>motivar</b> (reconocer públicamente, expectativas claras, recursos, resolver conflictos) y <b>dinamizar</b> (reuniones al inicio de fase, rituales, planificar en equipo, paquete de introducción).",
"<b>Ética</b>: hacer lo correcto con el proceso correcto, sin atajos. Integridad y responsabilidad profesional; cumplir leyes y políticas; no priorizar el proyecto sobre la sociedad. Cuatro valores del Código del PMI: <b>responsabilidad, respeto, imparcialidad y honestidad</b>; los 12 principios y el Código son complementarios."],
key:["Matriz: el director de proyecto no tiene autoridad directa sobre los técnicos.","5 tipologías: autoridad crece del tipo 1 al 5.","Autoridad informal (liderazgo) más importante que la formal.","Valores PMI: responsabilidad, respeto, imparcialidad, honestidad."],
q:"En una organización matricial, ¿quién decide «quién lo hace» y quién «cuándo se hace»?",a:"«Quién lo hace» (asignación de personal) y «cómo» lo decide el director de la unidad funcional; «qué», «cuándo» y «cuánto cuesta» corresponden al director de proyecto."}
];
